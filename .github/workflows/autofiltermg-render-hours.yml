name: AutoFilterMG daily online hours

on:
  schedule:
    # UTC: 07:00 IST and recovery every 10 minutes.
    - cron: '30 1 * * *'
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autofiltermg-render-hours
  cancel-in-progress: false

jobs:
  reconcile-hours:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake and check Render during IST online hours
        shell: bash
        run: |
          set -euo pipefail
          hour=$(TZ=Asia/Kolkata date +%H)
          if (( 10#${hour} >= 1 && 10#${hour} < 7 )); then
            echo "Quiet hours: no HTTP traffic. UptimeRobot schedule handles monitoring."
            exit 0
          fi
          # Free services wake on HTTP requests. Suspend/resume API returned 403.
          curl --fail --silent --show-error --location --retry 2 --retry-delay 5 \
            --connect-timeout 15 --max-time 75 \
            --output /tmp/render-health.txt \
            https://autofilterbotnew-ioi4.onrender.com/
          grep -Fq "Telegram bot process is running" /tmp/render-health.txt
          echo "HTTP listener responding; Telegram polling is not independently verified."
