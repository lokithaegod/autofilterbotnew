name: AutoFilterMG Free Uptime Check

on:
  schedule:
    # Every 10 minutes; avoid top-of-hour congestion.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autofiltermg-uptime-check
  cancel-in-progress: false

jobs:
  check:
    name: Check Render bot web endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check HTTP response
        env:
          QUIET_HOURS_ACTIVE: ${{ secrets.RENDER_API_KEY != '' && secrets.UPTIMEROBOT_API_KEY != '' }}
        run: |
          # Only skip overnight checks after BOTH automation secrets exist.
          # Otherwise preserve the previous always-on monitoring behavior.
          if [ "$QUIET_HOURS_ACTIVE" = "true" ]; then
            hour="$(TZ=Asia/Kolkata date +%H)"
            if [ "$hour" -ge 1 ] && [ "$hour" -lt 7 ]; then
              echo "Scheduled off-hours: skip HTTP request (01:00–07:00 IST)."
              exit 0
            fi
          fi
          curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 5 \
            --connect-timeout 15 --max-time 90 \
            --output /tmp/render-health.txt \
            "https://autofilterbotnew-ioi4.onrender.com/"
          grep -Fq "Telegram bot process is running" /tmp/render-health.txt
          echo "AutoFilterMG HTTP endpoint responding."

# This only checks that the web listener responds, not Telegram polling,
# MongoDB health, Force Sub, or index operations.
# GitHub scheduled workflows may be delayed, skipped, or disabled.
