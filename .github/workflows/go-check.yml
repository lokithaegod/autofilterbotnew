name: Check Go Bot
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Test subtitle filters and bot packages
        run: go test ./internal/core ./internal/autofilter
      - name: Compile bot
        run: go build ./...
      - name: Validate nightly schedule safely
        run: |
          python3 -m py_compile scripts/night_schedule.py
          python3 -m unittest discover -s scripts -p "test_night_schedule.py" -v
