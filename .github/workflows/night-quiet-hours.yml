name: AutoFilterMG Night Quiet Hours

on:
  schedule:
    # UTC minute 2/17/32/47 -> IST minute 32/47/02/17.
    # First target runs are approximately 01:02 and 07:02 IST.
    # GitHub schedule execution can be delayed; repeat every 15 minutes.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autofiltermg-night-scheduler
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile UptimeRobot monitoring (IST)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify scheduler syntax and local time boundaries
        run: |
          python3 -m py_compile scripts/night_schedule.py
          python3 scripts/night_schedule.py --self-test
      - name: Apply 1 AM to 7 AM monitoring schedule
        env:
          UPTIMEROBOT_API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
        run: python3 scripts/night_schedule.py

# Render suspend/resume API is intentionally not used. Render Free may sleep
# when idle, but that is not an exact 01:00 shutoff guarantee.
# Keep UPTIMEROBOT_API_KEY in GitHub Actions secrets; never print the key.
