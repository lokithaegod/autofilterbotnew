name: Malayalam subtitles branch checks

on:
  push:
    branches:
      - feature/malayalam-subtitles
  pull_request:
    paths:
      - "internal/subtitles/**"
      - "internal/core/**"
      - "internal/database/**"
      - "internal/compatfinder/**"
      - "internal/captiontags/**"
      - "scripts/compatibility_probe.py"
      - "scripts/test_compatibility_probe.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Test video identity and edition matching
        run: go test ./internal/compatfinder
      - name: Test caption-based Malayalam Sub classification
        run: go test ./internal/captiontags -v
      - name: Test subtitle parsing
        run: go test ./internal/subtitles
      - name: Test read-only audio verification logic
        run: |
          python3 -m py_compile scripts/compatibility_probe.py
          python3 -m unittest discover -s scripts -p test_compatibility_probe.py -v
      - name: Compile affected application packages
        run: go test ./internal/core ./internal/database/mongo -run '^$'
